# ===================================
# AntStrike Backend - Docker Compose Dev
# ===================================

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: antstrike-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: antstrike_cti
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache/Queue
  redis:
    image: redis:7-alpine
    container_name: antstrike-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Backend API (optionnel, pour tester)
  # backend:
  #   build: .
  #   container_name: antstrike-backend
  #   environment:
  #     NODE_ENV: development
  #     DATABASE_URL: postgresql://postgres:admin123@postgres:5432/antstrike_cti?schema=public
  #     REDIS_URL: redis://redis:6379
  #     TARANIS_API_URL: http://host.docker.internal:8080
  #   ports:
  #     - "4000:4000"
  #   depends_on:
  #     - postgres
  #     - redis
  #   volumes:
  #     - ./src:/app/src

volumes:
  postgres_data:
  redis_data:




